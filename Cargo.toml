[package]
name = "colorms"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "Colorms — a Material You colour maker"
authors = ["Colorms"]
repository = "https://github.com/KOGGUA-EDIT/colorms"
keywords = ["color-picker", "material-you", "egui"]

[[bin]]
name = "colorms"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
egui = "=0.33.3"
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
winit = "=0.30.13"

[dev-dependencies]
criterion = "0.7"
tempfile = "3.27"

[[bench]]
name = "color"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

